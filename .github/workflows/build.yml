name: Build Taf-Taf APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare Taf-Taf APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Taf-Taf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taf-Taf-APK
          path: Taf-Taf.apk
          if-no-files-found: error
          retention-days: 30
