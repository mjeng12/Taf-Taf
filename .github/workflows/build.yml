name: Build Taf-Taf APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project and build APK
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle could not be found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle --no-daemon :app:assembleDebug

      - name: Prepare Taf-Taf APK
        shell: bash
        run: |
          APK_FILE=$(find . -path "*/app/build/outputs/apk/debug/app-debug.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Built APK could not be found."
            exit 1
          fi

          echo "APK found at: $APK_FILE"
          cp "$APK_FILE" Taf-Taf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taf-Taf-APK
          path: Taf-Taf.apk
          if-no-files-found: error
          retention-days: 30
